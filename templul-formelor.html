<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Templul Formelor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,800;1,400&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: scenă 3D la stânga (sus pe telefon), poveste + întrebare la dreapta; bandă HUD cu harta camerelor. Temă unică: templu întunecat, lumină de torță. */
:root{
  color-scheme:dark;
  --night:#14100b; --panel:#201911; --panel2:#2a2117; --line:#3d3123;
  --sand:#ead6aa; --text:#f4ead7; --muted:#bba985;
  --gold:#f2b544; --torch:#ff8a3d; --cyan:#5fd6e8; --ok:#86d993; --bad:#ff7d6e;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.5;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(255,138,61,.16),transparent 55%),radial-gradient(ellipse at 110% 110%,rgba(95,214,232,.07),transparent 50%);}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(20,16,11,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hudin{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;color:var(--gold);font-size:1.05rem}
.map{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.map button.n{background:transparent;cursor:pointer;padding:0}
.map .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .78rem var(--f-mono);border:1.5px solid var(--line);color:var(--muted)}
.map .n.done{background:var(--gold);color:var(--night);border-color:var(--gold)}
.map .n.cur{border-color:var(--torch);color:var(--torch);box-shadow:0 0 0 3px rgba(255,138,61,.2)}
.map i{width:8px;height:2px;background:var(--line)}
.stat{display:flex;gap:14px;margin-left:auto;align-items:center;font-family:var(--f-mono);font-size:.9rem}
.torches{display:flex;gap:4px}
.torches svg{width:18px;height:22px}
main{padding-block:22px 48px}
.game{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.stage{position:relative;aspect-ratio:1/1;max-height:76vh;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 40%,#2b2116 0%,#16110c 70%);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none}
.labels span{position:absolute;transform:translate(-50%,-50%);font:600 .82rem var(--f-mono);color:var(--sand);text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap}
.labels span.hl{color:var(--gold)}
.stage .tip{position:absolute;left:12px;bottom:10px;font-size:.8rem;color:var(--muted);pointer-events:none}
.stage .err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.legend{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;font-size:.78rem;pointer-events:none}
.legend span{display:flex;gap:6px;align-items:center;background:rgba(20,16,11,.7);padding:2px 8px;border-radius:6px}
.legend b{width:14px;height:4px;border-radius:2px;display:inline-block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2{font-family:var(--f-display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(2rem,5vw,3rem);color:var(--gold)}
h2{font-size:1.45rem;color:var(--sand)}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--torch);font-weight:800}
.story{font-style:italic;color:var(--sand);border-left:3px solid var(--torch);padding-left:14px}
.muted{color:var(--muted)}
.q{font-size:1.2rem;line-height:1.55}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:1.02rem;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:rgba(242,181,68,.12)}
.opt.right{border-color:var(--ok);background:rgba(134,217,147,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,125,110,.12)}
.opt:disabled{cursor:default}
input[type=text]{font:600 1.3rem var(--f-mono);padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);width:100%;max-width:220px}
input#pname{font:1.05rem var(--f-body);max-width:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:800 1rem var(--f-body);letter-spacing:.02em;padding:11px 20px;border-radius:12px;border:1.5px solid var(--gold);background:var(--gold);color:var(--night);cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.fb{padding:12px 14px;border-radius:12px;font-size:1rem}
.fb.ok{background:rgba(134,217,147,.12);border:1px solid rgba(134,217,147,.4)}
.fb.ko{background:rgba(255,125,110,.1);border:1px solid rgba(255,125,110,.4)}
.fb.hint{background:rgba(95,214,232,.08);border:1px solid rgba(95,214,232,.35)}
.fb b{font-family:var(--f-display);letter-spacing:.03em}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--gold)} .prog i.c{background:var(--torch)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip.lv1{color:var(--ok);border-color:rgba(134,217,147,.4)} .chip.lv2{color:var(--gold);border-color:rgba(242,181,68,.4)} .chip.lv3{color:var(--bad);border-color:rgba(255,125,110,.4)}
.chip{font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stars{color:var(--gold);font-size:1.3rem;letter-spacing:2px}
.cert{border:2px solid var(--gold);border-radius:18px;padding:22px;background:linear-gradient(160deg,rgba(242,181,68,.08),transparent 60%);display:flex;flex-direction:column;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.tbl td:last-child{text-align:right;font-family:var(--f-mono);color:var(--gold)}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
sup{font-size:.7em}

.lock{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.lock svg{flex:none}
.lock .lt{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{min-width:40px;height:40px;padding:0 8px;border-radius:8px;display:grid;place-items:center;font:600 1rem var(--f-mono);border:1.5px dashed var(--line);color:var(--muted)}
.slot.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:rgba(242,181,68,.1)}
.slot.miss{border-style:solid;border-color:var(--bad);color:var(--bad)}
.slot.cur{border-color:var(--torch)}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.labels,.legend{transition:opacity .3s}
#clock{color:var(--muted)}
@media (max-width:820px){
  .game{grid-template-columns:1fr}
  .stage{aspect-ratio:auto;height:46vh;min-height:280px}
  .opts{grid-template-columns:1fr}
  .stat{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hud"><div class="wrap hudin">
  <span class="logo">Templul Formelor</span>
  <div class="map" id="map" aria-label="Harta camerelor"></div>
  <div class="stat"><span id="clock">timp 00:00</span><span class="torches" id="torches" aria-label="Torțe"></span><span id="starsTot" aria-label="Stele">★ 0</span></div>
</div></header>

<main class="wrap">
  <div class="game">
    <div class="stage" id="stage" aria-label="Model 3D. Trage cu degetul sau cu mouse-ul ca să rotești corpul.">
      <div class="labels" id="labels"></div>
      <div class="legend" id="legend"></div>
      <p class="tip">Trage ca să rotești corpul de pe piedestal</p>
      <div class="fade" id="fade"></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ======================= CORPURI =======================
const P=(x,y,z)=>[x,y,z];
const SOLIDS={};
(function(){
 const s=1.05;
 SOLIDS.cube={name:'Cubul ABCDA′B′C′D′',v:{A:P(-s,-s,s),B:P(s,-s,s),C:P(s,-s,-s),D:P(-s,-s,-s),"A′":P(-s,s,s),"B′":P(s,s,s),"C′":P(s,s,-s),"D′":P(-s,s,-s)},
  f:[['A','B','C','D'],['A′','B′','C′','D′'],['A','B','B′','A′'],['B','C','C′','B′'],['C','D','D′','C′'],['D','A','A′','D′']]};
 const a=1.45,b=.75,c=.95;
 SOLIDS.para={name:'Paralelipipedul dreptunghic ABCDA′B′C′D′',v:{A:P(-a,-b,c),B:P(a,-b,c),C:P(a,-b,-c),D:P(-a,-b,-c),"A′":P(-a,b,c),"B′":P(a,b,c),"C′":P(a,b,-c),"D′":P(-a,b,-c)},
  f:[['A','B','C','D'],['A′','B′','C′','D′'],['A','B','B′','A′'],['B','C','C′','B′'],['C','D','D′','C′'],['D','A','A′','D′']]};
 const r=1.15,h=1.05,t=k=>[r*Math.sin(k*2*Math.PI/3),r*Math.cos(k*2*Math.PI/3)];
 const [a0,a1,a2]=[t(0),t(1),t(2)];
 SOLIDS.prism={name:'Prisma triunghiulară regulată ABCA′B′C′',v:{A:P(a0[0],-h,a0[1]),B:P(a1[0],-h,a1[1]),C:P(a2[0],-h,a2[1]),"A′":P(a0[0],h,a0[1]),"B′":P(a1[0],h,a1[1]),"C′":P(a2[0],h,a2[1])},
  f:[['A','B','C'],['A′','B′','C′'],['A','B','B′','A′'],['B','C','C′','B′'],['C','A','A′','C′']]};
 const q=1.1;
 SOLIDS.pyr={name:'Piramida patrulateră regulată VABCD',v:{A:P(-q,-.85,q),B:P(q,-.85,q),C:P(q,-.85,-q),D:P(-q,-.85,-q),V:P(0,1.35,0)},
  f:[['A','B','C','D'],['V','A','B'],['V','B','C'],['V','C','D'],['V','D','A']]};
 SOLIDS.pyrap={name:'Piramida patrulateră regulată VABCD (O = centrul bazei, M = mijlocul lui BC)',v:Object.assign({},SOLIDS.pyr.v,{O:P(0,-.85,0),M:P(q,-.85,0)}),f:SOLIDS.pyr.f};
 SOLIDS.cubenet={name:'Desfășurarea cubului',v:{},f:[],net:true,noEdges:true};
 const u=1.0;
 SOLIDS.tetra={name:'Tetraedrul regulat ABCD',v:{A:P(u,u,u),B:P(u,-u,-u),C:P(-u,u,-u),D:P(-u,-u,u)},
  f:[['A','B','C'],['A','B','D'],['A','C','D'],['B','C','D']]};
 SOLIDS.cubetetra={name:'Cubul și un tetraedru regulat ascuns în el',v:SOLIDS.cube.v,f:SOLIDS.cube.f,faint:true};
 const pts={},R=1.35;for(let k=0;k<6;k++)pts['ABCDEF'[k]]=P(R*Math.cos(k*Math.PI/3),-.7,R*Math.sin(k*Math.PI/3));
 pts.P=P(.2,1.25,.1);
 SOLIDS.points={name:'6 puncte coplanare și punctul P din afara planului',v:pts,f:[],plane:['A','B','C','D','E','F'],noEdges:true};
})();
function edgesOf(sol){if(sol.noEdges)return [];const set=new Map();for(const f of sol.f)for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length];const k=[a,b].sort().join('|');if(!set.has(k))set.set(k,[a,b]);}return [...set.values()];}

// ======================= POVESTEA ȘI ÎNTREBĂRILE =======================
const netOpt=(L,cells)=>{const w=Math.max(...cells.map(c=>c[0]))+1,h=Math.max(...cells.map(c=>c[1]))+1,u=16;
 return `<span style="display:flex;gap:12px;align-items:center"><b>${L})</b><svg viewBox="-2 -2 ${w*u+4} ${h*u+4}" width="${w*u+4}" height="${h*u+4}" aria-label="desfășurarea ${L}">${cells.map(([x,y])=>`<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}" fill="rgba(242,181,68,.2)" stroke="#f2b544" stroke-width="1.5"/>`).join('')}</svg></span>`;};
const LVN={1:'ușor',2:'mediu',3:'avansat'};
const AMB='amber',CY='cyan';
const CH=[
 {name:'Camera de Cristal',solid:'cube',story:'Arheologul Matei a dispărut în Templul Formelor. Ultimul lui mesaj: „Ușile se deschid doar pentru cine înțelege corpurile din spațiu.” În prima sală plutește un cub uriaș de cristal.',
  qs:[
   {t:'num',p:'Pe ușă scrie: „Spune-mi câte muchii are cubul și te las să treci.”',a:12,hint:'Numără muchiile bazei de jos, apoi pe ale bazei de sus, apoi pe cele verticale.',ex:'4 muchii în baza de jos + 4 în baza de sus + 4 muchii verticale = 12 muchii.'},
   {t:'mc',p:'Două raze de lumină urmăresc dreptele <b class="a">AB</b> și <b class="c">C′D′</b>. Ce poziție au aceste drepte?',o:['paralele','concurente','necoplanare','perpendiculare'],a:0,h:{e:[['A','B',AMB],['C′','D′',CY]],f:[[['A','B','C′','D′'],AMB]]},
    hint:'Caută un plan care să le conțină pe amândouă. Este colorat pe model.',ex:'AB ∥ DC și DC ∥ D′C′, deci AB ∥ C′D′. Ambele se află în planul (ABC′D′).'},
   {t:'mc',p:'Acum lumina cade pe <b class="a">AB</b> și <b class="c">CC′</b>. Ce poziție au aceste drepte?',o:['paralele','concurente','necoplanare','confundate'],a:2,h:{e:[['A','B',AMB],['C','C′',CY]]},
    hint:'Au un punct comun? Pot fi puse în același plan?',ex:'AB și CC′ nu au niciun punct comun și nu sunt paralele, deci nu există un plan care să le conțină pe amândouă. Sunt drepte necoplanare.'},
   {t:'num',p:'Pe tavan strălucește triunghiul <b class="a">A′BD</b>, cu laturile diagonale ale fețelor. Este echilateral. Câte triunghiuri echilaterale se pot forma, în total, cu vârfurile cubului?',a:8,h:{tri:[[['A′','B','D'],AMB]]},
    hint:'Triunghiul colorat „taie” vârful A. Fiecare vârf al cubului poate fi tăiat la fel.',ex:'Pentru fiecare vârf, cele 3 vârfuri vecine formează un triunghi echilateral cu latura egală cu diagonala unei fețe. Cubul are 8 vârfuri, deci 8 triunghiuri.'},
  ]},
 {name:'Biblioteca de Piatră',solid:'para',story:'Ușa se deschide spre o bibliotecă. În mijloc stă un raft de piatră în formă de paralelipiped dreptunghic. Matei a lăsat un bilet: „Aici am învățat cum stau dreptele față de plane.”',
  qs:[
   {t:'mc',p:'Ce poziție are dreapta <b class="a">D′C′</b> față de planul <b class="c">(ABB′)</b>?',o:['este inclusă în plan','este paralelă cu planul','intersectează planul într-un punct','este perpendiculară pe plan'],a:1,h:{e:[['D′','C′',AMB]],f:[[['A','B','B′','A′'],CY]]},
    hint:'Compară D′C′ cu o dreaptă din planul colorat.',ex:'D′C′ ∥ DC ∥ AB, iar AB este în planul (ABB′). D′C′ nu are puncte în acest plan, deci este paralelă cu planul.'},
   {t:'mc',p:'Muchia <b class="a">AA′</b> „ține” raftul. Ce poziție are față de planul bazei <b class="c">(ABC)</b>?',o:['paralelă cu planul','inclusă în plan','perpendiculară pe plan','paralelă cu AB'],a:2,h:{e:[['A','A′',AMB]],f:[[['A','B','C','D'],CY]]},
    hint:'Ce unghi face AA′ cu AB? Dar cu AD?',ex:'AA′ ⊥ AB și AA′ ⊥ AD, adică este perpendiculară pe două drepte concurente din plan. Deci AA′ ⊥ (ABC).'},
   {t:'mc',p:'Două fețe ale raftului luminează: <b class="a">(ABB′)</b> și <b class="c">(DCC′)</b>. Ce poziție au aceste plane?',o:['paralele','secante','confundate','perpendiculare'],a:0,h:{f:[[['A','B','B′','A′'],AMB],[['D','C','C′','D′'],CY]]},
    hint:'Sunt fețe opuse sau vecine?',ex:'Fețele opuse ale paralelipipedului sunt în plane paralele: nu au niciun punct comun.'},
   {t:'num',p:'Matei vrea să lipească o bandă aurie pe <b>toate muchiile</b> raftului. Dimensiunile sunt 5 dm, 4 dm și 3 dm. Câți decimetri de bandă îi trebuie?',a:48,
    hint:'Paralelipipedul are 12 muchii: câte 4 de fiecare lungime.',ex:'4 · 5 + 4 · 4 + 4 · 3 = 4 · (5 + 4 + 3) = 48 dm.'},
  ]},
 {name:'Turnul Prismei',solid:'prism',story:'Scările urcă într-un turn. Pe un piedestal se rotește încet o prismă triunghiulară regulată din obsidian. Pe zid: „Trei laturi jos, trei sus și trei care le leagă.”',
  qs:[
   {t:'num',p:'Câte muchii are prisma triunghiulară?',a:9,hint:'Recitește inscripția de pe zid.',ex:'3 muchii în baza de jos + 3 în baza de sus + 3 muchii laterale = 9.'},
   {t:'num',p:'Pe altă ușă scrie: „Prisma mea are 18 muchii.” Câte fețe laterale are această prismă?',a:6,hint:'O prismă cu baza un poligon cu <i>n</i> laturi are 3<i>n</i> muchii.',ex:'3<i>n</i> = 18, deci <i>n</i> = 6. Baza este un hexagon, iar prisma are 6 fețe laterale.'},
   {t:'mc',p:'Ce poziție au dreptele <b class="a">AB</b> și <b class="c">B′C′</b>?',o:['paralele','concurente','necoplanare','perpendiculare'],a:2,h:{e:[['A','B',AMB],['B′','C′',CY]]},
    hint:'Dreptele sunt în bazele prismei, iar bazele sunt în plane paralele.',ex:'Bazele sunt în plane paralele, deci dreptele nu au puncte comune. Nu sunt nici paralele: B′C′ ∥ BC, iar BC face un unghi de 60° cu AB. Deci sunt necoplanare.'},
   {t:'mc',p:'Ca să deschizi ușa turnului, „desfaci” fețele laterale colorate și le așezi pe podea, una lângă alta. Ce figură obții?',o:['un dreptunghi','un triunghi','un trapez','un cerc'],a:0,h:{f:[[['A','B','B′','A′'],AMB],[['B','C','C′','B′'],AMB],[['C','A','A′','C′'],AMB]],legend:[['amber','fețele laterale']]},
    hint:'Ce formă are fiecare față laterală a unei prisme drepte?',ex:'Fețele laterale sunt 3 dreptunghiuri congruente, cu aceeași înălțime. Puse una lângă alta, formează un dreptunghi.'},
  ]},
 {name:'Sala Faraonului',solid:'pyr',story:'Coborâți într-o sală adâncă. În centru stă o piramidă patrulateră regulată de aur. Lângă ea, carnetul lui Matei: „Piramidele au un singur vârf de sus, dar multe secrete.”',
  qs:[
   {t:'num',p:'Câte muchii are piramida VABCD?',a:8,hint:'Numără muchiile bazei și muchiile care pleacă din V.',ex:'4 muchii ale bazei + 4 muchii laterale (VA, VB, VC, VD) = 8.'},
   {t:'num',p:'În carnet scrie: „Am văzut o piramidă cu 7 fețe.” Câte muchii avea acea piramidă?',a:12,hint:'O față este baza; celelalte sunt laterale, câte una pentru fiecare latură a bazei.',ex:'7 fețe = 1 bază + 6 fețe laterale, deci baza este un hexagon. Muchii: 6 ale bazei + 6 laterale = 12.'},
   {t:'mc',p:'Ce poziție au dreptele <b class="a">VA</b> și <b class="c">BC</b>?',o:['paralele','concurente','necoplanare','confundate'],a:2,h:{e:[['V','A',AMB],['B','C',CY]]},
    hint:'VA atinge planul bazei într-un singur punct. Este acel punct pe BC?',ex:'VA intersectează planul bazei doar în A, iar A nu este pe BC. Dreptele nu au puncte comune și nu sunt paralele, deci sunt necoplanare.'},

const $=s=>document.querySelector(s);

 $('#map').innerHTML=CH.map((c,i)=>`${i?'<i></i>':''}<button class="n ${st.results[i].done?'done':''} ${st.phase!=='intro'&&st.phase!=='end'&&i===st.ch?'cur':''}" data-ch="${i}" title="${c.name}" aria-label="Camera ${i+1}: ${c.name}">${i+1}</button>`).join('');
 document.querySelectorAll('#map button').forEach(b=>b.addEventListener('click',()=>{if(!st.name)st.name='Explorator';st.ch=+b.dataset.ch;st.phase='chapter';render();window.scrollTo({top:0});}));
 $('#torches').innerHTML=[0,1,2].map(i=>torchSVG(i<st.torches)).join('');
 $('#starsTot').textContent='★ '+st.results.reduce((s,r)=>s+r.stars,0);
}
const curQ=()=>CH[st.ch].qs[st.qi];

function render(){
 hud();const pnl=$('#panel');
 if(three)setRoom(st.phase==='intro'?-1:st.phase==='end'?CH.length-1:st.ch);
 if(st.phase==='intro'){
  setScene('cube',{});
  pnl.innerHTML=`<p class="eyebrow">Joc · Corpuri geometrice · clasa a VIII-a</p>
   <h1>Templul Formelor</h1>
   <p class="story">Arheologul Matei a intrat în Templul Formelor și nu s-a mai întors. Pornești după el. Templul are ${CH.length} camere închise, iar fiecare ușă are un lacăt cu cifru. Cifrul se formează din răspunsurile tale la sarcinile din cameră. Ai 3 torțe în fiecare cameră, iar la fiecare greșeală se stinge una.</p>
   <div class="chips">${CH.map((c,i)=>`<span class="chip">${i+1}. ${c.name}</span>`).join('')}</div>

  return;
 }
 if(st.phase==='chapter'){
  const c=CH[st.ch];setScene(c.solid,{});
  pnl.innerHTML=`<p class="eyebrow">Camera ${st.ch+1} din ${CH.length} · ușa din spate este încuiată</p><h2>${c.name}</h2><p class="story">${c.story}</p>

 [[-3.88,-2.6],[3.88,-2.6],[-3.88,2],[3.88,2]].forEach(([x,z])=>{const sg=Math.sign(x);const sk=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.55,8),stick);sk.position.set(x-sg*.12,2.45,z);sk.rotation.z=sg*.45;scene.add(sk);
  const fl=new THREE.Mesh(new THREE.SphereGeometry(.085,12,10),new THREE.MeshBasicMaterial({color:0xffa040}));fl.position.set(x-sg*.24,2.78,z);fl.scale.set(1,1.8,1);scene.add(fl);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),new THREE.MeshBasicMaterial({color:0xfff0b0}));core.position.set(x-sg*.24,2.75,z);scene.add(core);
  const L=new THREE.PointLight(0xff8a3d,1.25,10,2);L.position.set(x-sg*.5,2.9,z);scene.add(L);ROOM.flames.push({fl,L,ph:Math.random()*10});});
 scene.add(new THREE.AmbientLight(0x6a5238,1.05));
 const top=new THREE.PointLight(0xfff0d0,.7,7,2);top.position.set(0,4.2,.6);scene.add(top);
}
function drawInsc(t){const g=ROOM.inscCtx,w=1024,h=160;g.clearRect(0,0,w,h);g.fillStyle='rgba(18,12,7,.85)';g.fillRect(40,20,w-80,h-40);g.strokeStyle='#b08a3a';g.lineWidth=4;g.strokeRect(48,28,w-96,h-56);
 g.fillStyle='#f2b544';g.textAlign='center';g.textBaseline='middle';let fs=62;do{g.font=`700 ${fs}px Cinzel, Georgia, serif`;fs-=2;}while(g.measureText(t).width>w-150&&fs>22);g.fillText(t,w/2,h/2+2);ROOM.inscTex.needsUpdate=true;ROOM.lastT=t;}
if(document.fonts)document.fonts.ready.then(()=>{if(ROOM.lastT&&three)drawInsc(ROOM.lastT);});
function setRoom(i){if(!three||ROOM.cur===i)return;ROOM.cur=i;const tint=new THREE.Color(TINTS[(i+1)%TINTS.length]);ROOM.walls.forEach(m=>m.color.copy(tint));drawInsc(i<0?'TEMPLUL FORMELOR':`${i+1} · ${CH[i].name.toUpperCase()}`);}
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function transition(cb){if(!three||!group){cb();return;}tw={t0:performance.now(),dur:reduce?700:3000,cb,stage:'walk'};$('#panel').style.pointerEvents='none';labelsEl.style.opacity=0;legendEl.style.opacity=0;}
function stepTw(now){const p=(now-tw.t0)/tw.dur;
 if(tw.stage==='walk'){const d=ease(p/.35)*1.55;ROOM.doorL.rotation.y=d;ROOM.doorR.rotation.y=-d;ROOM.lockMesh.visible=p<.05;
  if(group)group.scale.setScalar(SOLID_SCALE*(1-ease(p/.3)));
  placeCam(reduce?0:ease((p-.22)/.78)*9.5);fadeEl.style.opacity=ease((p-.72)/.28);
  if(p>=1){const cb=tw.cb;tw={t0:now,dur:650,stage:'in'};ROOM.doorL.rotation.y=0;ROOM.doorR.rotation.y=0;ROOM.lockMesh.visible=true;placeCam(0);sceneKey='';cb();if(group)group.scale.setScalar(SOLID_SCALE);}}
 else{fadeEl.style.opacity=1-ease(p);if(p>=1){tw=null;fadeEl.style.opacity=0;$('#panel').style.pointerEvents='';labelsEl.style.opacity=1;legendEl.style.opacity=1;}}}
function loop(t){
 if(renderer){
  if(tw)stepTw(t);
  if(group){if(!drag&&!reduce&&t-lastInteract>2500)rotY+=.0035;if(anim)anim(t);group.rotation.set(rotX,rotY,0);}
  for(const f of ROOM.flames){const k=reduce?1:.84+.12*Math.sin(t*.012+f.ph)+.06*Math.sin(t*.037+f.ph*2);f.L.intensity=1.25*k;f.fl.scale.set(1,1.8*k,1);}
  if(ROOM.ring&&!reduce)ROOM.ring.material.opacity=.25+.15*Math.sin(t*.002);
  scene.updateMatrixWorld();renderer.render(scene,camera);
  if(group){const w=stage.clientWidth,h=stage.clientHeight;
   for(const L of labelMap){const v=L.p.clone().applyMatrix4(group.matrixWorld).project(camera);L.el.style.left=((v.x+1)/2*w)+'px';L.el.style.top=((1-v.y)/2*h)+'px';}}
 }
 requestAnimationFrame(loop);
}
render();
</script>
